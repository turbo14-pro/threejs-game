<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Fight</title>
    <style>
      /* Loading screen — shows before JS arrives */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #app-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-title {
        font-family: 'Arial Black', Arial, sans-serif;
        font-size: clamp(2rem, 6vw, 4rem);
        font-weight: 900;
        letter-spacing: 0.15em;
        color: #ffffff;
        text-shadow: 0 0 40px rgba(255, 180, 0, 0.8), 0 0 80px rgba(255, 100, 0, 0.4);
        margin-bottom: 2.5rem;
        animation: pulse-glow 2s ease-in-out infinite;
      }
      @keyframes pulse-glow {
        0%, 100% { text-shadow: 0 0 30px rgba(255,180,0,0.7), 0 0 60px rgba(255,80,0,0.3); }
        50%       { text-shadow: 0 0 60px rgba(255,200,0,1.0), 0 0 120px rgba(255,100,0,0.6); }
      }
      .loader-bar-wrap {
        width: min(320px, 80vw);
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 1.2rem;
      }
      .loader-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ff6b00, #ffd700, #ff6b00);
        background-size: 200% 100%;
        border-radius: 999px;
        animation: bar-fill 4s cubic-bezier(0.4,0,0.2,1) forwards,
                   shimmer 1.2s linear infinite;
      }
      @keyframes bar-fill {
        0%   { width: 0%; }
        60%  { width: 75%; }
        90%  { width: 92%; }
        100% { width: 100%; }
      }
      @keyframes shimmer {
        0%   { background-position: 200% center; }
        100% { background-position: -200% center; }
      }
      .loader-tip {
        font-family: Arial, sans-serif;
        font-size: 0.85rem;
        color: rgba(255,255,255,0.4);
        letter-spacing: 0.08em;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <!-- Loading screen: pure HTML so it shows before any JS downloads -->
    <div id="app-loader">
      <div class="loader-title">FOOD FRENZY</div>
      <div class="loader-bar-wrap">
        <div class="loader-bar"></div>
      </div>
      <div class="loader-tip">Loading game assets…</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
