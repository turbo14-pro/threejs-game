<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 500">
  <defs>
    <!-- Gaussian blur for the glowing 50px border effect -->
    <filter id="border-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" />
    </filter>

    <!-- Clip path matching the outer box boundary -->
    <clipPath id="card-clip">
      <rect x="25" y="25" width="950" height="450" rx="225" ry="225" />
    </clipPath>
  </defs>

  <!-- Base Rectangle (#808080 Background) -->
  <rect x="25" y="25" width="950" height="450" rx="225" ry="225" fill="#808080" />

  <!-- Inner Clipped Borders -->
  <g clip-path="url(#card-clip)">
    <!-- Top & Left Red Blurry Border -->
    <path d="M 975 25 L 250 25 A 225 225 0 0 0 25 250 L 25 475" fill="none" stroke="#FF0000" stroke-width="50" stroke-linecap="round" filter="url(#border-blur)" />

    <!-- Bottom & Right Blue Blurry Border -->
    <path d="M 25 475 L 750 475 A 225 225 0 0 0 975 250 L 975 25" fill="none" stroke="#0000FF" stroke-width="50" stroke-linecap="round" filter="url(#border-blur)" />
  </g>
</svg>